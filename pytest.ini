[pytest]
# `ref/` is the WG1 reference software, vendored locally for the constant-tracing in
# docs/06 and excluded from the repo. It ships its own `test_*.py` files that import
# a decade-old skimage API, so a bare `pytest` in this directory fails at collection
# on code that is not ours. Ours all lives in `tests/`.
testpaths = tests
addopts = -q
